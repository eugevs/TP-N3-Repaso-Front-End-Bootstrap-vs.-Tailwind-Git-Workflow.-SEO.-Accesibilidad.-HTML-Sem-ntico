<section class="container py-5" aria-labelledby="titulo-galeria">
  <h1 id="titulo-galeria">Guarda o publica tus experiencias</h1>
  <p class="mb-4">Explorá las fotos compartidas por la comunidad o subí las tuyas para inspirar a otros aventureros.</p>

  <div class="mb-4">
    <label for="foto" class="form-label">Subí tu foto</label>
    <input class="form-control" type="file" id="foto" accept="image/*">
  </div>

  <h2 class="h3 mb-3">Galería</h2>
  <div class="row row-cols-2 row-cols-md-3 g-3">
    <div class="col"><img src="img/ruta-bici.png" class="galeria-img rounded" alt="Ciclista en un sendero de montaña"></div>
    <div class="col"><img src="img/caminata-bosque.png" class="galeria-img rounded" alt="Dos personas caminando por el bosque"></div>
    <div class="col"><img src="img/sendero-bosque.png" class="galeria-img rounded" alt="Sendero de tierra entre helechos"></div>
    <div class="col"><img src="img/costa-rio.png" class="galeria-img rounded" alt="Costa de un río con piedras"></div>
    <div class="col"><img src="img/cerro-mirador.png" class="galeria-img rounded" alt="Cartel del Cerro Mirador con vista al lago"></div>
    <div class="col"><img src="img/equipamiento.png" class="galeria-img rounded" alt="Equipo de camping sobre una mesa de madera"></div>
  </div>
</section>
